<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reflexo</title>
</head>
<body onkeydown="funcao(this, event)">
<h1>Jogo de Reflexo</h1>
<button onclick="comecar()">Começar</button>
<h2 id="letra">-</h2>
<p id="aviso"></p>
<p>Pontos: <span id="pontos">0</span> | Tempo: <span id="tempo">20</span></p>

<script>
var letras = ["A", "W", "S", "D"];
var atual = "";
var pontos = 0;
var tempo = 20;
var rodando = false;

function comecar() {
  pontos = 0;
  tempo = 20;
  rodando = true;
  document.getElementById("pontos").innerHTML = pontos;
  document.getElementById("aviso").innerHTML = "";
  novaLetra();
  contar();
}

function novaLetra() {
  var n = Math.floor(Math.random() * 4);
  atual = letras[n];
  document.getElementById("letra").innerHTML = atual;
}

function contar() {
  document.getElementById("tempo").innerHTML = tempo;
  if (tempo == 0) {
    rodando = false;
    document.getElementById("letra").innerHTML = "-";
    document.getElementById("aviso").innerHTML = "Acabou! Você fez " + pontos + " pontos";
  } else {
    tempo = tempo - 1;
    setTimeout(contar, 1000);
  }
}

function funcao(el, event) {
  if (rodando == false) return;
  if (event.key.toUpperCase() == atual) {
    pontos = pontos + 1;
  } else {
    pontos = pontos - 1;
  }
  document.getElementById("pontos").innerHTML = pontos;
  novaLetra();
}
</script>
</body>
</html>
